<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cruds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crud">
        <div class="head">
            <h2>crud</h2>
            <p>product managment system</p>
        </div>
        <!-- inputs -->
        <div class="inputs">
            <input type="text" id="title" placeholder="title" >
            <div class="price">
                <input onkeyup="getTotal()" type="number" id="price" placeholder="price" >
                <input onkeyup="getTotal()" type="number" id="taxes" placeholder="taxes" >
                <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads" >
                <input onkeyup="getTotal()" type="number" id="discount" placeholder="discount" >                
                <small  id="total"></small>
            </div>
            <input type="number" id="count" placeholder="count" >
            <input type="text" id="category" placeholder="category" >
            <button id="submit">create</button>
        </div>
        <!-- outputs -->
        <div class="outputs">
            <div class="searshBlock">
                <input onkeyup="searchData(this.value)" type="text" id="search" placeholder="search" >
                <div class="btnSearsh">
                    <button onclick="setSearchMode('searchTitle')" id="searchTitle">Search by Title</button>
                    <button onclick="setSearchMode('searchCategory')" id="searchCategory">Search by Category</button>
                </div>
            </div>
            <br>
            <!-- زر حذف الكل -->
            <div id="deleteAllContainer"></div>
            <!-- table -->
            <table id="table">
                <thead>
                    <tr>
                        <th>id</th>
                        <th>title</th>
                        <th>price</th>
                        <th>taxes</th>
                        <th>ads</th>
                        <th>discount</th>
                        <th>total</th>
                        <th>category</th>
                        <th>update</th>
                        <th>delete</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <!-- data will be inserted here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
